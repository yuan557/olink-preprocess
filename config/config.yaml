# Non-identifiable workflow parameters.
# Identifiable info (project name, DAR ID, paths) goes in .env and config/project.yaml.

product_type: "Reveal"        # Reveal | ExploreHT | Explore3072
normalization: "Intensity"    # PlateControl (single plate) | Intensity (multi-plate)
analysis_ref_ids:
  - "R10002"
run_units_flag: "all-reveal"  # all-reveal | all-explore3072 | all-explore-ht-v1 | all-explore-ht-v2
split_by_library: false

apptainer_module: "apptainer/1.3.5"

counts_base_dir: "data/counts"
project_dir:     "data/project"
npx_output_dir:  "results/npx"
