# Snakemake SLURM executor profile (snakemake >= 8).
# Run: snakemake --profile profiles/slurm --use-envmodules
#
# Requires the snakemake-executor-plugin-slurm package:
#   pip install snakemake-executor-plugin-slurm

executor: slurm

default-resources:
  slurm_account: def-thesdx
  mem_mb: 8000
  runtime: 60
  cpus_per_task: 1

jobs: 20
latency-wait: 60
rerun-incomplete: true
use-envmodules: true
